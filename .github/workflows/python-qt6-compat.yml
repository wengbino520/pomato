name: Python / Qt6 compatibility

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  py310-qt6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke import check
        run: |
          python - <<'PY'
          import sys
          print(sys.version)
          import main
          print('main import ok')
          PY
  py311-qt6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Smoke import check
        run: |
          python - <<'PY'
          import sys
          print(sys.version)
          import main
          print('main import ok')
          PY
